name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --all-targets --features quic
      - run: cargo test --all-targets --features quic
      - run: cargo clippy --all-targets --features quic -- -D warnings
      - run: cargo check --all-targets --features ebpf
      - run: cargo test --all-targets --features ebpf
      - run: cargo clippy --all-targets --features ebpf -- -D warnings
      - run: cargo bench --bench erasure --no-run
