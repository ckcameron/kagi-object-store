name: SysML model validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate-model-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned SysML syntax checker
        run: cargo install sysml2 --version 0.3.1 --locked
      - name: Install Python adapter dependencies
        run: python -m pip install 'jsonschema==4.25.1' 'PyYAML==6.0.2'
      - name: Check SysML v2 syntax
        run: sysml check models/sysml/architecture.sysml
      - name: Validate model bundle and emit interchange
        run: python scripts/validate-sysml.py --revision "$GITHUB_SHA" --output /tmp/kagi-sysml-interchange.json
      - name: Test validator and planner adapter
        run: python -m unittest discover -s tests/sysml -v
      - name: Parse interchange JSON
        run: python -c "import json; json.load(open('/tmp/kagi-sysml-interchange.json'))"
