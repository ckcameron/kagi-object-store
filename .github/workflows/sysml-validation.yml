name: SysML model validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate-model-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate model structure and traceability
        run: python scripts/validate-sysml.py --revision "$GITHUB_SHA" --output /tmp/kagi-sysml-interchange.json
      - name: Test validator
        run: python -m unittest discover -s tests/sysml -v
      - name: Parse interchange JSON
        run: python -c "import json; json.load(open('/tmp/kagi-sysml-interchange.json'))"
