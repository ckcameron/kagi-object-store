# SPDX-License-Identifier: CC-BY-NC-SA-4.0
name: security-and-robustness

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependency scanners
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: RustSec advisory scan
        run: cargo audit
      - name: Dependency advisory/source policy
        run: cargo deny check advisories sources

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz wire length handling
        run: cargo +nightly fuzz run wire_frame -- -max_total_time=30
      - name: Fuzz erasure round-trip invariants
        run: cargo +nightly fuzz run erasure_roundtrip -- -max_total_time=45

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri wire and arithmetic invariants
        env:
          RUSTFLAGS: -C target-feature=-avx2,-avx512f,-avx512bw
        run: |
          cargo +nightly miri test --lib wire::tests
          cargo +nightly miri test --lib erasure::tests::matrix_rejects_overflowing_dimensions
          cargo +nightly miri test --lib erasure::tests::gf_inverse_roundtrip

  address-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: ASan library tests
        run: bash scripts/kagi-sanitize address

  thread-sanitizer:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: TSan library tests
        run: bash scripts/kagi-sanitize thread
