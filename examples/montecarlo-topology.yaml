policies:
  default:
    protection:
      type: reed_solomon
      k: 2
      m: 4
    tolerate:
      disks: 1
      hosts: 1
      racks: 1
      sites: 1
      networks: 1
    optimize:
      auto_geometry: true
      max_total_fragments: 6
      max_storage_overhead: 3.0
failure_model:
  disk_annual_probability: 0.01
  host_annual_probability: 0.002
  rack_annual_probability: 0.0005
  site_annual_probability: 0.0001
  network_annual_probability: 0.001
  importance_bias: 8.0
  correlated_events: []
repair_model:
  disk_mttr_hours: 24
  host_mttr_hours: 4
  rack_mttr_hours: 4
  site_mttr_hours: 24
  network_mttr_hours: 1
  repair_bandwidth_bytes_per_sec: 1000000000
