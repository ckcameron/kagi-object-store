policies:
  default:
    protection:
      type: reed_solomon
      k: 4
      m: 2
    locality:
      site: spread
      rack: spread
      max_fragments_per_host: 1
      max_fragments_per_disk: 1
    tolerate:
      disks: 2
      hosts: 2
      racks: 2
      sites: 2
      networks: 2
    optimize:
      auto_geometry: true
      max_total_fragments: 6
      min_data_fragments: 2
