join_key_b64: "REPLACE_WITH_KAGI_JOIN_KEY"
cluster:
  join_key_hash_hex: "REPLACE_WITH_HASH_FROM_KAGI_GENERATED_YAML"
  id: prod-a
  placement_salt: 1161981756646125696
  replication: 3
  write_quorum: 2
  chunk_replicas: 1
  # Generate with: openssl rand -base64 32
  metadata_key_b64: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  # Omit erasure to retain replication. New EC objects default to CLAY.
  erasure:
    backend: auto        # auto | cpu | cuda | hip | opencl (GPU backends require their Cargo feature)
    scheme: clay         # clay (default) | msr | reed_solomon
    data_shards: 6
    parity_shards: 3
    repair_helpers: 8    # CLAY: k+1..k+m-1; larger d reduces repair bandwidth
    gpu_threshold_bytes: 1048576
    max_gpu_inflight: 32
    max_matrix_cache_bytes: 268435456
  hosts:
    - id: host-a1
      endpoint: https://10.0.1.11:7400
      site: site-a
      rack: rack-a1
      disks:
        - { id: a1d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme0n1, serial_number: REPLACE_HOST_A1_NVME0_SERIAL }
        - { id: a1d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme1n1, serial_number: REPLACE_HOST_A1_NVME1_SERIAL }
        - { id: a1d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme2n1, serial_number: REPLACE_HOST_A1_NVME2_SERIAL }
        - { id: a1d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme3n1, serial_number: REPLACE_HOST_A1_NVME3_SERIAL }
        - { id: a1d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme4n1, serial_number: REPLACE_HOST_A1_NVME4_SERIAL }
        - { id: a1d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme, device_path: /dev/nvme5n1, serial_number: REPLACE_HOST_A1_NVME5_SERIAL }
    - id: host-a2
      endpoint: https://10.0.1.12:7400
      site: site-a
      rack: rack-a2
      disks:
        - { id: a2d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a2d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a2d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a2d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a2d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a2d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
    - id: host-a3
      endpoint: https://10.0.1.13:7400
      site: site-a
      rack: rack-a3
      disks:
        - { id: a3d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a3d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a3d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a3d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a3d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: a3d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
    - id: host-b1
      endpoint: https://10.1.1.11:7400
      site: site-b
      rack: rack-b1
      disks:
        - { id: b1d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b1d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b1d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b1d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b1d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b1d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
    - id: host-b2
      endpoint: https://10.1.1.12:7400
      site: site-b
      rack: rack-b2
      disks:
        - { id: b2d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b2d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b2d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b2d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b2d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b2d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
    - id: host-b3
      endpoint: https://10.1.1.13:7400
      site: site-b
      rack: rack-b3
      disks:
        - { id: b3d0, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b3d1, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b3d2, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b3d3, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b3d4, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }
        - { id: b3d5, capacity_bytes: 8000000000000, weight: 1.0, storage_kind: nvme }

local_host: host-a1
data_root: /var/lib/kagi
listen: 0.0.0.0:7400


metadata:
  node_id: host-a1
  election_min_ms: 1500
  election_max_ms: 3000
  heartbeat_ms: 400
  # List OTHER voting members. Each node uses the same IDs/endpoints, excluding itself.
  peers:
    - { id: host-a2, endpoint: https://10.0.1.12:7400, site: site-a, rack: rack-a2 }
    - { id: host-a3, endpoint: https://10.0.1.13:7400, site: site-a, rack: rack-a3 }
    - { id: host-b1, endpoint: https://10.1.1.11:7400, site: site-b, rack: rack-b1 }
    - { id: host-b2, endpoint: https://10.1.1.12:7400, site: site-b, rack: rack-b2 }
    - { id: host-b3, endpoint: https://10.1.1.13:7400, site: site-b, rack: rack-b3 }

# Enable after issuing a cluster CA and per-host certificates.
# All peer certificates should contain the hostname/IP used in cluster.hosts[].endpoint.
tls:
  ca: /etc/kagi/pki/ca.pem
  cert: /etc/kagi/pki/host-a1.pem
  key: /etc/kagi/pki/host-a1-key.pem

recovery:
  heartbeat_ms: 2000
  suspect_after_ms: 6000
  down_after_ms: 15000
  out_after_ms: 120000
  repair_interval_ms: 10000
  max_parallel_repairs: 4
  return_probe_successes: 3
  # Flap detection applies independently to site, rack, server, and disk.
  # Two complete down/up cycles = four availability transitions.
  flap_window_ms: 300000
  flap_transition_threshold: 4
  # A quarantined resource stays excluded until continuously healthy for this
  # period, unless an operator explicitly clears its flap quarantine.
  minimum_reinclude_uptime_ms: 600000

garbage_collection:
  enabled: true
  # Deleted versions remain physically recoverable for this period before GC.
  grace_period_ms: 86400000
  interval_ms: 30000
  max_versions_per_cycle: 32

# v14 identity integration boundary. Resolve Unix identities with NSS/PAM and
# Active Directory identities with Kerberos/SSPI/LDAP in the trusted filesystem gateway.
# ACLs persist numeric UID/GID and AD SID principals, so renames do not change identity.
filesystem:
  overlay_index: decentralized-gossip
  identity_principals:
    - unix_uid_gid
    - active_directory_sid
  acl_model: nfsv4

# v16 post-quantum node identity. Generate on each host with:
# kagi-cluster-host --config /etc/kagi/node.yaml generate-pq-identity \
#   --public /etc/kagi/pki/host-a1.mldsa87.pub \
#   --secret /etc/kagi/pki/host-a1.mldsa87.key
post_quantum:
  required: true
  identity_secret: /etc/kagi/pki/host-a1.mldsa87.key
  identity_public: /etc/kagi/pki/host-a1.mldsa87.pub
  peer_public_keys:
    host-a2: /etc/kagi/pki/host-a2.mldsa87.pub
    host-a3: /etc/kagi/pki/host-a3.mldsa87.pub
    host-b1: /etc/kagi/pki/host-b1.mldsa87.pub
    host-b2: /etc/kagi/pki/host-b2.mldsa87.pub
    host-b3: /etc/kagi/pki/host-b3.mldsa87.pub

# Point-in-time snapshots initially reference immutable object versions. As overwritten/deleted
# source versions accumulate retained delta, the leader materializes the snapshot into full copies.
snapshots:
  enabled: true
  check_interval_ms: 30000
  archive_after_delta_bytes: 10737418240
  archive_after_delta_ratio: 0.50

# v22 background maintenance policy. Empty windows mean any time.
maintenance:
  enabled: true
  timezone: America/Los_Angeles
  quotas:
    network_mbps: 100
    cpu_percent: 20
    memory_mib: 512
    max_concurrency: 2
  scrub_interval_ms: 300000
  scrub:
    enabled: true
    windows:
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "01:00"
        end: "06:00"
  proactive_repair:
    enabled: true
    windows: []
  garbage_collection:
    enabled: true
    windows: []
  snapshot_archive:
    enabled: true
    windows:
      - days: [sat, sun]
        start: "00:00"
        end: "23:59"

  rebalance:
    enabled: true
    windows: []

# Kagi web operations console. Use TLS or a trusted TLS reverse proxy.
web_console:
  enabled: true
  userdb: /etc/kagi/users.yaml
  log_path: /var/log/kagi/kagi.log
  max_log_lines: 500
