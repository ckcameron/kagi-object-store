# SPDX-License-Identifier: CC-BY-NC-SA-4.0
# Replace image and KAGI_API_ENDPOINT before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: kagi-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagi-csi-controller
  namespace: kagi-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagi-csi-controller
  namespace: kagi-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kagi-csi-controller
  template:
    metadata:
      labels:
        app: kagi-csi-controller
    spec:
      serviceAccountName: kagi-csi-controller
      containers:
        - name: kagi-csi
          image: ghcr.io/ckcameron/kagi-csi:latest
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: KAGI_CSI_MODE
              value: controller
            - name: KAGI_API_ENDPOINT
              value: http://kagi-cluster-host.kagi-system.svc.cluster.local:7400
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
          ports: []
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election=true
            - --timeout=30s
            - --retry-interval-start=5s
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kagi-csi-node
  namespace: kagi-system
spec:
  selector:
    matchLabels:
      app: kagi-csi-node
  template:
    metadata:
      labels:
        app: kagi-csi-node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: kagi-csi
          image: ghcr.io/ckcameron/kagi-csi:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAGI_CSI_MODE
              value: node
            - name: KAGI_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KAGI_API_ENDPOINT
              value: http://kagi-cluster-host.kagi-system.svc.cluster.local:7400
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: KAGI_CSI_STATE_DIR
              value: /var/lib/kubelet/plugins/csi.kagi.io/volumes
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: modules
              mountPath: /lib/modules
              readOnly: true
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.kagi.io/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.kagi.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
