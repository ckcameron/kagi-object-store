# Static CSI claim for an existing Kagi volume. Replace the volume ID and API endpoint.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kagi-existing-block
spec:
  capacity:
    storage: 100Gi
  volumeMode: Block
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: csi.kagi.io
    volumeHandle: REPLACE_WITH_KAGI_VOLUME_ID
    volumeAttributes:
      apiEndpoint: http://kagi-cluster-host.kagi-system.svc.cluster.local:7400
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kagi-existing-block
spec:
  volumeMode: Block
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: kagi-existing-block
