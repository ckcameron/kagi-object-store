[package]
name = "kagi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kagi-object-store = { path = ".." }
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "wire_frame"
path = "fuzz_targets/wire_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "erasure_roundtrip"
path = "fuzz_targets/erasure_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
